name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Contract and pipeline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Validate data contracts
        run: make check-contracts

      - name: Run unit tests
        run: make test-unit

      - name: Run PostgreSQL integration tests
        run: make test-integration

      - name: Bootstrap full pipeline
        run: make bootstrap

      - name: Run end-to-end smoke test
        run: make e2e

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p ci-artifacts
          docker compose ps -a > ci-artifacts/compose-ps.txt || true
          docker compose logs --no-color > ci-artifacts/compose.log || true

      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-diagnostics-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Docker services
        if: always()
        run: docker compose down -v --remove-orphans
