name: order_created
version: 1
topic: ecommerce.order_created.v1
owner: orders-team

key:
  - order_id

schema:
  allow_extra_fields: false

  fields:
    - name: order_id
      type: string
      nullable: false

    - name: customer_id
      type: string
      nullable: false

    - name: amount
      type: decimal(12,2)
      nullable: false

    - name: currency
      type: string
      nullable: false
      enum: ["RUB", "USD", "EUR"]

    - name: created_at
      type: timestamp
      nullable: false

quality:
  unique_key:
    - order_id

  not_null:
    - order_id
    - customer_id
    - amount
    - created_at

compatibility:
  mode: backward