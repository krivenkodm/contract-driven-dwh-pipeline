x-airflow-common: &airflow-common
  profiles:
    - airflow

  build:
    context: .
    dockerfile: Dockerfile.airflow

  image: contract-dwh-airflow:3.3.0

  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: contract-dwh-local-jwt-secret-change-me-0123456789-contract-dwh-local-9876543210
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
    AIRFLOW_ANALYTICS_SCHEDULE: "${AIRFLOW_ANALYTICS_SCHEDULE:-*/5 * * * *}"
    CONTRACT_DWH_APP_DIR: /opt/contract-dwh
    CONTRACTS_DIR: /opt/contract-dwh/contracts
    SCHEMA_REGISTRY_URL: http://redpanda:8081
    POSTGRES_DSN: postgresql://dwh:dwh@postgres:5432/dwh
    DBT_PROJECT_DIR: /opt/contract-dwh/dbt
    DBT_PROFILES_DIR: /opt/contract-dwh/dbt
    DBT_HOST: postgres
    DBT_PORT: "5432"
    DBT_USER: dwh
    DBT_PASSWORD: dwh
    DBT_DATABASE: dwh
    DBT_SCHEMA: dbt
    ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs


services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: contract_redpanda

    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      - "19092:19092"
      - "18081:18081"
      - "9644:9644"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: contract_dwh_postgres

    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: dwh

    ports:
      - "55432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dwh -d dwh
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  topic-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract_dwh_topic_init

    command:
      - python
      - src/topic_manager.py

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CONTRACTS_DIR: /app/contracts

    depends_on:
      redpanda:
        condition: service_started

    restart: "no"


  schema-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract_dwh_schema_init

    command:
      - python
      - src/schema_registry_manager.py

    environment:
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONTRACTS_DIR: /app/contracts

    depends_on:
      redpanda:
        condition: service_started

    restart: "no"


  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract_dwh_consumer

    command:
      - python
      - src/consumer.py

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_DSN: postgresql://dwh:dwh@postgres:5432/dwh
      CONTRACTS_DIR: /app/contracts
      CONSUMER_GROUP_ID: contract-dwh-loader-v1
      SCHEMA_REGISTRY_URL: http://redpanda:8081

    depends_on:
      schema-init:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    restart: unless-stopped


  analytics-runner:
    profiles:
      - orchestration

    build:
      context: .
      dockerfile: Dockerfile.analytics

    container_name: contract_dwh_analytics_runner

    command:
      - python
      - src/analytics_runner.py
      - --trigger
      - scheduled
      - --interval-seconds
      - "${ANALYTICS_RUN_INTERVAL_SECONDS:-300}"

    environment:
      POSTGRES_DSN: postgresql://dwh:dwh@postgres:5432/dwh
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: dwh
      DBT_PASSWORD: dwh
      DBT_DATABASE: dwh
      DBT_SCHEMA: dbt
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"

    depends_on:
      consumer:
        condition: service_started
      postgres:
        condition: service_healthy

    restart: unless-stopped


  airflow-postgres:
    profiles:
      - airflow

    image: postgres:16
    container_name: contract_dwh_airflow_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  airflow-init:
    <<: *airflow-common
    container_name: contract_dwh_airflow_init

    command:
      - bash
      - -c
      - airflow db migrate

    depends_on:
      airflow-postgres:
        condition: service_healthy

    restart: "no"


  airflow-api-server:
    <<: *airflow-common
    container_name: contract_dwh_airflow_api_server

    command:
      - api-server

    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-common
    container_name: contract_dwh_airflow_scheduler

    command:
      - scheduler

    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      airflow-api-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully

    restart: unless-stopped


  airflow-dag-processor:
    <<: *airflow-common
    container_name: contract_dwh_airflow_dag_processor

    command:
      - dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


  grafana:
    profiles:
      - monitoring

    image: grafana/grafana:13.1.0
    container_name: contract_dwh_grafana

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/contract-dwh-operations.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      DWH_GRAFANA_USER: "${GRAFANA_DB_USER:-grafana_reader}"
      DWH_GRAFANA_PASSWORD: "${GRAFANA_DB_PASSWORD:-grafana}"

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  airflow_logs:
  airflow_postgres_data:
  grafana_data:
  postgres_data:
  redpanda_data:
