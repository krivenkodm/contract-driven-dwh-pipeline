services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: contract_redpanda

    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      - "19092:19092"
      - "18081:18081"
      - "9644:9644"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: contract_dwh_postgres

    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: dwh

    ports:
      - "55432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dwh -d dwh
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  topic-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract_dwh_topic_init

    command:
      - python
      - src/topic_manager.py

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CONTRACTS_DIR: /app/contracts

    depends_on:
      redpanda:
        condition: service_started

    restart: "no"


  schema-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract_dwh_schema_init

    command:
      - python
      - src/schema_registry_manager.py

    environment:
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONTRACTS_DIR: /app/contracts

    depends_on:
      redpanda:
        condition: service_started

    restart: "no"


  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract_dwh_consumer

    command:
      - python
      - src/consumer.py

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_DSN: postgresql://dwh:dwh@postgres:5432/dwh
      CONTRACTS_DIR: /app/contracts
      CONSUMER_GROUP_ID: contract-dwh-loader-v1
      SCHEMA_REGISTRY_URL: http://redpanda:8081

    depends_on:
      schema-init:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    restart: unless-stopped


  analytics-runner:
    profiles:
      - orchestration

    build:
      context: .
      dockerfile: Dockerfile.analytics

    container_name: contract_dwh_analytics_runner

    command:
      - python
      - src/analytics_runner.py
      - --trigger
      - scheduled
      - --interval-seconds
      - "${ANALYTICS_RUN_INTERVAL_SECONDS:-300}"

    environment:
      POSTGRES_DSN: postgresql://dwh:dwh@postgres:5432/dwh
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: dwh
      DBT_PASSWORD: dwh
      DBT_DATABASE: dwh
      DBT_SCHEMA: dbt
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"

    depends_on:
      consumer:
        condition: service_started
      postgres:
        condition: service_healthy

    restart: unless-stopped


  grafana:
    profiles:
      - monitoring

    image: grafana/grafana:13.1.0
    container_name: contract_dwh_grafana

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/contract-dwh-operations.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      DWH_GRAFANA_USER: "${GRAFANA_DB_USER:-grafana_reader}"
      DWH_GRAFANA_PASSWORD: "${GRAFANA_DB_PASSWORD:-grafana}"

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  grafana_data:
  postgres_data:
  redpanda_data:
