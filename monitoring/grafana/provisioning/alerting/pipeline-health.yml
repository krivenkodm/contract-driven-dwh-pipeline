apiVersion: 1

groups:
  - orgId: 1
    name: Contract DWH pipeline health
    folder: Contract DWH
    interval: 1m
    rules:
      - uid: contract_dwh_pipeline_critical
        title: Contract DWH pipeline is critical
        condition: C
        data:
          - refId: A
            datasourceUid: contract-dwh-postgres
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: grafana-postgresql-datasource
                uid: contract-dwh-postgres
              editorMode: code
              format: time_series
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: >-
                SELECT observed_at AS time, health_code AS value
                FROM dbt_monitoring.monitor_pipeline_health
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions: []
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: contract-dwh-operations
        panelId: 1
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          description: >-
            The operational health model reports a critical state. Inspect the
            dashboard health reason, dbt run history, freshness, and DLQ panels.
          summary: Contract DWH pipeline requires attention
        labels:
          service: contract-dwh
          severity: critical
        isPaused: false
